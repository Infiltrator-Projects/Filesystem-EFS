name: Native EFS Common V2 qualification and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact canonical Common V2 source
        run: |
          git clone https://github.com/Infiltrator-Projects/Libraries.git Libraries
          git -C Libraries checkout 225e640ebed5351b1481bfbeef1a6144ca5146e7
      - name: Compile and test the actual shared object
        run: make check
      - name: Native CPU qualification
        run: |
          make clean
          make PROFILE=aggressive check
      - name: Address and undefined behaviour sanitizers
        run: |
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check

  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone https://github.com/Infiltrator-Projects/Libraries.git Libraries
          git -C Libraries checkout 225e640ebed5351b1481bfbeef1a6144ca5146e7
          make all build/test_oracle
          sh tests/oracle.sh

  production-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build and extract exact candidate package
        run: |
          set -euo pipefail
          git clone https://github.com/Infiltrator-Projects/Libraries.git Libraries
          git -C Libraries checkout 225e640ebed5351b1481bfbeef1a6144ca5146e7
          make all
          sh scripts/package.sh dist
          dpkg-deb -x dist/*.deb candidate
          cmp build/EFS.so candidate/System/Filesystems/EFS.so
          sudo install -Dm644 candidate/System/Filesystems/EFS.so /System/Filesystems/EFS.so
      - name: Build the actual provider-neutral consumer
        run: |
          set -euo pipefail
          # Only Ubuntu repositories are needed for these build dependencies.
          # Ignore unrelated runner-image vendor feeds, not package failures.
          opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          test -s /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y --no-install-recommends build-essential cmake pkg-config libgtk-3-dev libssl-dev libsqlite3-dev libext2fs-dev
          git clone https://github.com/Infiltrator-Projects/Defragmenter.git consumer
          git -C consumer checkout 4f7743f0f848d747884f1c18d6cf5e8b30e96742
          git -C consumer submodule update --init --recursive
          cmake -S consumer/defragger -B consumer/build -DBUILD_TESTING=ON -DLD_ENABLE_WERROR=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build consumer/build --parallel 2
          sudo cmake --install consumer/build
      - name: Qualify the full real production corpus and both mutation policies
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          fixture=consumer/build/defragmenter-test-media-raw-test
          "$fixture" preflight efs
          "$fixture" preflight-corpus efs
          "$fixture" qualify-create efs "$work/media.img"
          "$fixture" verify efs "$work/media.img"
          "$fixture" verify-corruption efs "$work/media.img"
          "$fixture" qualify-defrag efs "$work/media.img"
          "$fixture" qualify-create efs "$work/growth.img"
          "$fixture" qualify-growth efs "$work/growth.img"
          "$fixture" preflight-mutations efs
          "$fixture" qualify-recovery efs
          echo 'EFS full production consumer qualification PASS'

  publish:
    needs: [native, interoperability, production-consumer]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package and qualify exact installed binary and source installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          version=$(cat VERSION)
          git clone https://github.com/Infiltrator-Projects/Libraries.git Libraries
          git -C Libraries checkout 225e640ebed5351b1481bfbeef1a6144ca5146e7
          make check build/test_oracle
          sh scripts/package.sh dist
          deb="dist/infiltrator-filesystem-efs_${version}_amd64.deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          dpkg-deb -x "$deb" /tmp/efs-portable
          so=/tmp/efs-portable/System/Filesystems/EFS.so
          cmp build/EFS.so "$so"
          test -z "$(nm -D --undefined-only "$so")"
          ! readelf -d "$so" | grep -q NEEDED
          for test in efs format journal namespace namespace_recovery defrag defrag_recovery; do
            "build/test_$test" "$so"
          done
          sh tests/oracle.sh "$so"
          common=$(git -C Libraries rev-parse HEAD)
          curl -fsSL --retry 3 "https://codeload.github.com/Infiltrator-Projects/Filesystem-EFS/tar.gz/$GITHUB_SHA" -o /tmp/efs-source.tar.gz
          curl -fsSL --retry 3 "https://codeload.github.com/Infiltrator-Projects/Libraries/tar.gz/$common" -o /tmp/efs-common.tar.gz
          source_hash=$(sha256sum /tmp/efs-source.tar.gz | cut -d' ' -f1)
          common_hash=$(sha256sum /tmp/efs-common.tar.gz | cut -d' ' -f1)
          run="dist/filesystem-efs-$version-native-installer.run"
          sed -e "s/@SOURCE@/$GITHUB_SHA/g" -e "s/@COMMON@/$common/g" -e "s/@SOURCE_HASH@/$source_hash/g" -e "s/@COMMON_HASH@/$common_hash/g" scripts/installer.in > "$run"
          chmod +x "$run"
          "$run" --profile aggressive --build-only --output /tmp/efs-native
          native="/tmp/efs-native/infiltrator-filesystem-efs_${version}_amd64.deb"
          test -s "$native"
          dpkg-deb -x "$native" /tmp/efs-native-package
          native_so=/tmp/efs-native-package/System/Filesystems/EFS.so
          test -z "$(nm -D --undefined-only "$native_so")"
          ! readelf -d "$native_so" | grep -q NEEDED
          for test in efs format journal namespace namespace_recovery defrag defrag_recovery; do
            "build/test_$test" "$native_so"
          done
          sh tests/oracle.sh "$native_so"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release exists; immutable assets retained."
            exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "EFS v$version" --notes "Independent native Common V2 SGI EFS. Durable provider-formatted writable namespace, actual standard and growth relocation, persistent adjacent reserves, independent bidirectional EFS interoperability. Foreign media are read-only. Hosted and import-free freestanding builds; firmware and kernel execution not separately qualified." "$deb" "$run"
